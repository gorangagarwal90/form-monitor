name: GemsNY Diamond Merge Recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diamond-merge-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  merge:
    name: Recover and validate completed diamond audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: '34666799478'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install merge dependencies
        run: pip install 'httpx>=0.27,<1' 'pillow>=10,<12' 'playwright>=1.45,<2'
      - name: Download validated snapshot and all completed shard artifacts
        run: |
          mkdir -p diamond_snapshot diamond_shards
          gh run download "$SOURCE_RUN_ID" -n diamond-inventory-snapshot -D diamond_snapshot
          gh run download "$SOURCE_RUN_ID" -p 'diamond-api-shard-*' -D diamond_shards
          test -f diamond_snapshot/diamond_snapshot.json
          echo "Downloaded shard info files: $(find diamond_shards -name shard_info.json | wc -l)"
          test "$(find diamond_shards -name shard_info.json | wc -l)" -eq 16
      - name: Strict merge validation
        run: |
          python diamond_api_recovery_v2.py merge \
            --snapshot diamond_snapshot/diamond_snapshot.json \
            --input-dir diamond_shards \
            --output-dir diamond_final \
            --shard-count 16
      - name: Upload recovered final diamond artifact
        uses: actions/upload-artifact@v4
        with:
          name: DIAMOND-API-RECOVERY-FINAL
          path: diamond_final/
          retention-days: 7
