name: GemsNY Diamond Grid Probe
on:
  push:
    branches: [main]
    paths:
      - 'diamond_probe.py'
      - '.github/workflows/diamond-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install 'playwright>=1.45,<2'
          python -m playwright install --with-deps chromium
      - run: python diamond_probe.py
